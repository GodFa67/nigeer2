<!DOCTYPE html>

<style>

      font-family: "微軟正黑體", sans-serif;
    }

    /* 通用的框框樣式（所有框框都會套用） */
    .media-container {
      border: 2px solid #ff1a1a;
      border-radius: 20px;
      padding: 15px;
      margin: 15px auto;
      display: flex;
      justify-content: center;
      background-color: rgb(255, 207, 207); /* 預設是白色 */
      max-width: 500px;
    }

    /* --- 這裡就是你的「單獨調色」指令 --- */
    .box1 .media-container {
      background-color: #81caff; /* 只有第一個框框會變成淺藍色 */
      border-color: #2196f3;     /* 只有第一個框框邊框會變藍色 */
    }

    /* 文字置中 */
    h1, p {text-align: center;}
  </style>
</head>
